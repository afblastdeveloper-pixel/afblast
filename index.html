<!doctype html>
<html lang="id" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7FC" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AF Blast – Blast Smarter. Grow Faster. Platform WA Blast profesional untuk mengelola blast WhatsApp dan tim pengirim." />
    <title>AF Blast – Blast Smarter. Grow Faster.</title>

    <!-- Anti-flicker theme initialization script -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('afblast.theme') || 'system';
          var isDark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#0B1220' : '#F4F7FC');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Noto Sans variants for multilingual support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
